name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.2"

      - uses: bufbuild/buf-action@v1.6.0
        with:
          version: 1.74.0
          setup_only: true

      - name: Lint
        run: make lint

      - name: Generated code is up to date
        run: make generate-check

      - name: Test
        run: go test ./... -count=1

      - name: Build image
        run: docker build -t ngumbah-gateway:ci .
